<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attendance CRM</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden; /* Screen se bahar overflow rokta hai */
      background: #f5f7fb;
      color: #172033;
      font-family: Inter, system-ui, Arial, sans-serif;
    }

    /* ── Header Layout ── */
    header {
      background: #172554;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
    }

    .header-brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }

    .header-brand h1 {
      font-size: clamp(15px, 4vw, 20px);
      font-weight: 700;
      line-height: 1.2;
      word-break: break-word;
    }

    .header-brand span {
      font-size: clamp(10px, 2.8vw, 12px);
      opacity: .80;
      line-height: 1.3;
    }

    .header-badge {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Main Container ── */
    .container {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 12px;
    }

    /* ── Summary Cards Grid ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
      width: 100%;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 10px #15203a10;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-left: 4px solid #2563eb;
      min-width: 0;
    }

    .card small {
      color: #64748b;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card strong {
      display: block;
      font-size: clamp(18px, 4vw, 26px);
      font-weight: 800;
      line-height: 1;
      color: #2563eb;
    }

    /* ── Responsive Panels & Grid ── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: start;
      width: 100%;
    }

    .panel {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 10px #15203a10;
      width: 100%;
      min-width: 0;
    }

    .panel h2 {
      font-size: 16px;
      margin-bottom: 12px;
    }

    /* ── Form Controls ── */
    label {
      font-size: 12px;
      font-weight: 600;
      display: block;
      margin: 10px 0 4px;
    }

    input, button, select {
      font: inherit;
      width: 100%;
      box-sizing: border-box;
    }

    input, select {
      padding: 10px;
      border: 1px solid #d8dee9;
      border-radius: 8px;
      font-size: 13px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
    }

    .primary {
      background: #2563eb;
      color: #fff;
    }

    .secondary {
      background: #e8eefc;
      color: #1d4ed8;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    /* ── Camera Area ── */
    .camera {
      width: 100%;
      aspect-ratio: 4/3;
      background: #0f172a;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 13px;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 8px;
      display: none;
      margin-top: 8px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .actions button {
      flex: 1;
    }

    .status {
      margin-top: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      background: #f1f5f9;
      font-size: 12px;
      line-height: 1.4;
      word-break: break-word;
    }

    /* ── Table Fixes (Scrollable Mobile) ── */
    .tablewrap {
      width: 100%;
      overflow-x: auto;
      margin-top: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      min-width: 480px; /* Reduced min-width */
    }

    .table th, .table td {
      padding: 8px;
      border-bottom: 1px solid #edf0f5;
      text-align: left;
      font-size: 12px;
    }

    .table th {
      color: #64748b;
      white-space: nowrap;
    }

    .badge {
      padding: 3px 7px;
      border-radius: 12px;
      background: #dcfce7;
      color: #166534;
      font-weight: 700;
      font-size: 11px;
    }

    a {
      color: #2563eb;
      text-decoration: none;
    }

    /* ── Media Queries ── */
    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr; /* Stack panels on tablet/mobile */
      }
      .cards {
        grid-template-columns: repeat(2, 1fr); /* 2x2 cards */
      }
    }

    @media (max-width: 500px) {
      .row {
        grid-template-columns: 1fr; /* Stack inputs */
        gap: 0;
      }
      .actions {
        flex-direction: column; /* Stack buttons */
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-brand">
      <h1>Attendance CRM</h1>
      <span>Selfie + GPS Attendance Management</span>
    </div>
    <div class="header-badge">&#128197; Live</div>
  </header>

  <div class="container">
    <div class="cards">
      <div class="card"><small>Total Employees</small><strong id="total">0</strong></div>
      <div class="card"><small>Present Today</small><strong id="present">0</strong></div>
      <div class="card"><small>Late / Other</small><strong id="late">0</strong></div>
      <div class="card"><small>Attendance %</small><strong id="percent">0%</strong></div>
    </div>

    <div class="grid">
      <section class="panel">
        <h2>Mark Attendance</h2>
        <div class="row">
          <div><label>Employee ID</label><input id="empId" placeholder="e.g. EMP001"></div>
          <div><label>Employee Name</label><input id="empName" placeholder="e.g. Florish Rathore"></div>
        </div>
        <label>Selfie</label>
        <div class="camera">
          <video id="video" autoplay playsinline></video>
          <span id="cameraText">Camera preview</span>
        </div>
        <div class="actions">
          <button class="secondary" onclick="startCamera()">Open Camera</button>
          <button class="primary" onclick="takeSelfie()">Capture Selfie</button>
        </div>
        <canvas id="canvas" style="display:none"></canvas>
        <img id="preview" class="preview">
        <label>Location</label>
        <button class="secondary" onclick="getLocation()">Get Current Location</button>
        <div id="locationStatus" class="status">Location not captured.</div>
        <div class="actions" style="margin-top:12px;">
          <button class="primary" onclick="submitAttendance()">Submit Attendance</button>
        </div>
        <div id="message" class="status">Please capture selfie and location before submitting.</div>
      </section>

      <section class="panel">
        <h2>Attendance Records</h2>
        <div class="row">
          <input id="search" placeholder="Search employee..." oninput="render()">
          <select id="filter" onchange="render()">
            <option value="all">All Records</option>
            <option value="today">Today</option>
          </select>
        </div>
        <div class="tablewrap">
          <table class="table">
            <thead>
              <tr>
                <th>Employee</th>
                <th>Date & Time</th>
                <th>Status</th>
                <th>Location</th>
                <th>Selfie</th>
              </tr>
            </thead>
            <tbody id="records"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <script>
    let stream = null, selfieData = "", gps = null;
    const key = "attendanceCRMRecords";
    function records() { return JSON.parse(localStorage.getItem(key) || "[]") }
    function save(r) { localStorage.setItem(key, JSON.stringify(r)) }
    
    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        video.srcObject = stream; cameraText.style.display = "none";
        message.textContent = "Camera is ready.";
      } catch (e) { message.textContent = "Camera permission denied or unavailable." }
    }

    function takeSelfie() {
      if (!stream) { message.textContent = "Please open the camera first."; return }
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);
      selfieData = canvas.toDataURL("image/jpeg", .82);
      preview.src = selfieData; preview.style.display = "block";
      message.textContent = "Selfie captured successfully.";
    }

    function getLocation() {
      if (!navigator.geolocation) { locationStatus.textContent = "Geolocation is not supported."; return }
      locationStatus.textContent = "Getting location...";
      navigator.geolocation.getCurrentPosition(p => {
        gps = { lat: p.coords.latitude, lng: p.coords.longitude, accuracy: Math.round(p.coords.accuracy) };
        locationStatus.innerHTML = `Lat: ${gps.lat.toFixed(4)} | Lng: ${gps.lng.toFixed(4)} | Acc: ±${gps.accuracy}m`;
      }, () => locationStatus.textContent = "Location permission denied.", { enableHighAccuracy: true, timeout: 10000 });
    }

    function submitAttendance() {
      const id = empId.value.trim(), name = empName.value.trim();
      if (!id || !name || !selfieData || !gps) { message.textContent = "Employee ID, name, selfie and location are required."; return }
      const now = new Date(), r = records();
      r.unshift({ id, name, time: now.toISOString(), status: "Present", lat: gps.lat, lng: gps.lng, accuracy: gps.accuracy, selfie: selfieData });
      save(r); render(); message.textContent = "Attendance submitted successfully.";
    }

    function render() {
      const all = records(), q = search.value.toLowerCase(), today = new Date().toDateString();
      const filtered = all.filter(x => (!q || (x.name + " " + x.id).toLowerCase().includes(q)) &&
        (filter.value === "all" || new Date(x.time).toDateString() === today));
      recordsEl = document.getElementById("records");
      recordsEl.innerHTML = filtered.map(x => {
        const d = new Date(x.time);
        return `<tr><td><b>${escapeHtml(x.name)}</b><br><small>${escapeHtml(x.id)}</small></td>
  <td>${d.toLocaleDateString()}<br><small>${d.toLocaleTimeString()}</small></td><td><span class="badge">${x.status}</span></td>
  <td><a target="_blank" href="https://www.google.com/maps?q=${x.lat},${x.lng}">View Map</a></td>
  <td><img src="${x.selfie}" style="width:40px;height:40px;object-fit:cover;border-radius:6px"></td></tr>`
      }).join("") || '<tr><td colspan="5">No records yet.</td></tr>';
      
      const todayRows = all.filter(x => new Date(x.time).toDateString() === today);
      total.textContent = new Set(all.map(x => x.id)).size;
      present.textContent = todayRows.length;
      late.textContent = 0;
      percent.textContent = (todayRows.length ? Math.min(100, Math.round(todayRows.length / Math.max(1, new Set(all.map(x => x.id)).size) * 100)) : 0) + "%";
    }

    function escapeHtml(s) { return s.replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m])) }
    render();
  </script>
</body>

</html>
